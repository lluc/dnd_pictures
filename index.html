<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        header {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #c9a227;
        }

        h1 {
            text-align: center;
            color: #c9a227;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #c9a227;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.3);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #c9a227;
            border-radius: 20px;
            background: transparent;
            color: #c9a227;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: capitalize;
        }

        .filter-btn:hover {
            background: rgba(201, 162, 39, 0.2);
        }

        .filter-btn.active {
            background: #c9a227;
            color: #1a1a2e;
        }

        .subcategory-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .subfilter-btn {
            padding: 6px 14px;
            border: 1px solid rgba(201, 162, 39, 0.5);
            border-radius: 15px;
            background: transparent;
            color: #c9a227;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: capitalize;
        }

        .subfilter-btn:hover {
            background: rgba(201, 162, 39, 0.15);
        }

        .subfilter-btn.active {
            background: rgba(201, 162, 39, 0.3);
            border-color: #c9a227;
        }

        .stats {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 0.9rem;
        }

        .mobile-header {
            display: none;
        }

        .menu-toggle {
            display: none;
        }

        main {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            color: #c9a227;
            font-size: 1.8rem;
            padding: 15px 0;
            border-bottom: 2px solid rgba(201, 162, 39, 0.3);
            margin-bottom: 20px;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title .count {
            font-size: 1rem;
            color: #888;
            font-weight: normal;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(201, 162, 39, 0.2);
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(201, 162, 39, 0.2);
            border-color: #c9a227;
        }

        .image-card.hidden {
            display: none;
        }

        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .image-card .name {
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            color: #c9a227;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lightbox-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(201, 162, 39, 0.3);
        }

        .lightbox-title {
            color: #c9a227;
            font-size: 1.5rem;
            margin-top: 20px;
            text-align: center;
        }

        .lightbox-category {
            color: #888;
            font-size: 1rem;
            margin-top: 5px;
            text-transform: capitalize;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }

            .mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 10px;
            }

            .mobile-header h1 {
                font-size: 1.3rem;
                margin-bottom: 0;
            }

            .menu-toggle {
                display: block;
                background: none;
                border: 2px solid #c9a227;
                color: #c9a227;
                font-size: 1.5rem;
                padding: 5px 12px;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.3s;
            }

            .menu-toggle:hover {
                background: rgba(201, 162, 39, 0.2);
            }

            .menu-toggle.open {
                background: rgba(201, 162, 39, 0.3);
            }

            header > h1 {
                display: none;
            }

            .controls {
                display: none;
                flex-direction: column;
                padding-top: 10px;
                border-top: 1px solid rgba(201, 162, 39, 0.3);
            }

            .controls.open {
                display: flex;
            }

            .search-box {
                min-width: unset;
                max-width: 100%;
                width: 100%;
                margin-bottom: 10px;
            }

            .search-box input {
                padding: 10px 15px;
            }

            .filter-buttons {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                width: 100%;
            }

            .filter-btn {
                padding: 8px 5px;
                font-size: 0.7rem;
                text-align: center;
            }

            .subcategory-filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding: 8px;
                margin: 10px -15px 0;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: thin;
            }

            .subfilter-btn {
                flex-shrink: 0;
                padding: 5px 12px;
                font-size: 0.7rem;
                white-space: nowrap;
            }

            .stats {
                font-size: 0.8rem;
                padding: 5px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .image-card img {
                height: 140px;
            }

            main {
                padding: 15px;
            }

            .category-title {
                font-size: 1.3rem;
            }
        }

        /* Loading animation */
        .image-card img {
            opacity: 0;
            transition: opacity 0.3s;
        }

        .image-card img.loaded {
            opacity: 1;
        }
    </style>
</head>

        const spellData = {

        };

        // Format name for display
        function formatName(filename) {
            return filename
                .replace(/_/g, ' ')
                .replace(/,/g, ', ')
                .replace(/\(/g, ' (')
                .replace(/\s+/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ')
                .trim();
        }

        // Create image card
        function createImageCard(category, filename, subCategory = null) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.dataset.category = category;
            card.dataset.name = filename.toLowerCase();
            if (subCategory) {
                card.dataset.subCategory = subCategory;
            }

            const img = document.createElement('img');
            // Handle nested feature paths
            const imgPath = subCategory
                ? `pictures_webp/${category}/${subCategory}/${filename}.webp`
                : `pictures_webp/${category}/${filename}.webp`;
            img.src = imgPath;
            img.alt = formatName(filename);
            img.loading = 'lazy';
            img.onload = () => img.classList.add('loaded');

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = formatName(filename);
            name.title = formatName(filename);

            card.appendChild(img);
            card.appendChild(name);

            card.addEventListener('click', () => openLightbox(category, filename, subCategory));

            return card;
        }

        // Initialize gallery
        function initGallery() {
            // Regular categories
            for (const [category, images] of Object.entries(imageData)) {
                const gallery = document.getElementById(`gallery-${category}`);
                images.forEach(filename => {
                    gallery.appendChild(createImageCard(category, filename));
                });
            }

            // Feature category with subfolders
            const featureGallery = document.getElementById('gallery-feature');
            const subfiltersContainer = document.getElementById('feature-subfilters');

            // Add "All" button for features
            const allBtn = document.createElement('button');
            allBtn.className = 'subfilter-btn active';
            allBtn.dataset.subfilter = 'all';
            allBtn.textContent = 'All Classes';
            subfiltersContainer.appendChild(allBtn);

            // Add buttons and images for each class
            for (const [className, features] of Object.entries(featureData)) {
                // Add subfilter button
                const btn = document.createElement('button');
                btn.className = 'subfilter-btn';
                btn.dataset.subfilter = className;
                btn.textContent = `${className} (${features.length})`;
                subfiltersContainer.appendChild(btn);

                // Add images
                features.forEach(filename => {
                    featureGallery.appendChild(createImageCard('feature', filename, className));
                });
            }

            // Setup subfilter click handlers for features
            subfiltersContainer.querySelectorAll('.subfilter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    subfiltersContainer.querySelectorAll('.subfilter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSubFilter = btn.dataset.subfilter;
                    applyFilters();
                });
            });

            // Skill category with subfolders (ability scores)
            const skillGallery = document.getElementById('gallery-skill');
            const skillSubfiltersContainer = document.getElementById('skill-subfilters');

            // Add "All" button for skills
            const allSkillBtn = document.createElement('button');
            allSkillBtn.className = 'subfilter-btn active';
            allSkillBtn.dataset.subfilter = 'all';
            allSkillBtn.textContent = 'All Abilities';
            skillSubfiltersContainer.appendChild(allSkillBtn);

            // Add buttons and images for each ability
            for (const [abilityName, skills] of Object.entries(skillData)) {
                // Add subfilter button
                const btn = document.createElement('button');
                btn.className = 'subfilter-btn';
                btn.dataset.subfilter = abilityName;
                btn.textContent = `${abilityName} (${skills.length})`;
                skillSubfiltersContainer.appendChild(btn);

                // Add images
                skills.forEach(filename => {
                    skillGallery.appendChild(createImageCard('skill', filename, abilityName));
                });
            }

            // Setup subfilter click handlers for skills
            skillSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    skillSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSkillSubFilter = btn.dataset.subfilter;
                    applyFilters();
                });
            });

            // Trait category with subfolders (races)
            const traitGallery = document.getElementById('gallery-trait');
            const traitSubfiltersContainer = document.getElementById('trait-subfilters');

            // Add "All" button for traits
            const allTraitBtn = document.createElement('button');
            allTraitBtn.className = 'subfilter-btn active';
            allTraitBtn.dataset.subfilter = 'all';
            allTraitBtn.textContent = 'All Races';
            traitSubfiltersContainer.appendChild(allTraitBtn);

            // Add buttons and images for each race
            for (const [raceName, traits] of Object.entries(traitData)) {
                // Add subfilter button
                const btn = document.createElement('button');
                btn.className = 'subfilter-btn';
                btn.dataset.subfilter = raceName;
                btn.textContent = `${raceName} (${traits.length})`;
                traitSubfiltersContainer.appendChild(btn);

                // Add images
                traits.forEach(filename => {
                    traitGallery.appendChild(createImageCard('trait', filename, raceName));
                });
            }

            // Setup subfilter click handlers for traits
            traitSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    traitSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTraitSubFilter = btn.dataset.subfilter;
                    applyFilters();
                });
            });

            // Spell category with subfolders (schools of magic)
            const spellGallery = document.getElementById('gallery-spell');
            const spellSubfiltersContainer = document.getElementById('spell-subfilters');

            // Add "All" button for spells
            const allSpellBtn = document.createElement('button');
            allSpellBtn.className = 'subfilter-btn active';
            allSpellBtn.dataset.subfilter = 'all';
            allSpellBtn.textContent = 'All Schools';
            spellSubfiltersContainer.appendChild(allSpellBtn);

            // Add buttons and images for each school
            for (const [schoolName, spells] of Object.entries(spellData)) {
                // Add subfilter button
                const btn = document.createElement('button');
                btn.className = 'subfilter-btn';
                btn.dataset.subfilter = schoolName;
                btn.textContent = `${schoolName} (${spells.length})`;
                spellSubfiltersContainer.appendChild(btn);

                // Add images
                spells.forEach(filename => {
                    spellGallery.appendChild(createImageCard('spell', filename, schoolName));
                });
            }

            // Setup subfilter click handlers for spells
            spellSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    spellSubfiltersContainer.querySelectorAll('.subfilter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSpellSubFilter = btn.dataset.subfilter;
                    applyFilters();
                });
            });
        }

        // Filter functions
        let currentFilter = 'all';
        let currentSearch = '';
        let currentSubFilter = 'all';
        let currentSkillSubFilter = 'all';
        let currentTraitSubFilter = 'all';
        let currentSpellSubFilter = 'all';

        function applyFilters() {
            const cards = document.querySelectorAll('.image-card');
            const sections = document.querySelectorAll('.category-section');
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesFilter = currentFilter === 'all' || card.dataset.category === currentFilter;
                const matchesSearch = currentSearch === '' || card.dataset.name.includes(currentSearch.toLowerCase());

                // Handle subfilter for features
                let matchesSubFilter = true;
                if (card.dataset.category === 'feature' && currentSubFilter !== 'all') {
                    matchesSubFilter = card.dataset.subCategory === currentSubFilter;
                }
                // Handle subfilter for skills
                if (card.dataset.category === 'skill' && currentSkillSubFilter !== 'all') {
                    matchesSubFilter = card.dataset.subCategory === currentSkillSubFilter;
                }
                // Handle subfilter for traits
                if (card.dataset.category === 'trait' && currentTraitSubFilter !== 'all') {
                    matchesSubFilter = card.dataset.subCategory === currentTraitSubFilter;
                }
                // Handle subfilter for spells
                if (card.dataset.category === 'spell' && currentSpellSubFilter !== 'all') {
                    matchesSubFilter = card.dataset.subCategory === currentSpellSubFilter;
                }

                const isVisible = matchesFilter && matchesSearch && matchesSubFilter;

                card.classList.toggle('hidden', !isVisible);
                if (isVisible) visibleCount++;
            });

            // Show/hide sections
            sections.forEach(section => {
                const category = section.dataset.category;
                const hasVisibleCards = section.querySelectorAll('.image-card:not(.hidden)').length > 0;
                const matchesFilter = currentFilter === 'all' || category === currentFilter;
                section.style.display = (matchesFilter && hasVisibleCards) ? 'block' : 'none';
            });

            // Show/hide subfilters containers
            const featureSubfiltersContainer = document.getElementById('feature-subfilters');
            featureSubfiltersContainer.style.display = (currentFilter === 'all' || currentFilter === 'feature') ? 'flex' : 'none';

            const skillSubfiltersContainer = document.getElementById('skill-subfilters');
            skillSubfiltersContainer.style.display = (currentFilter === 'all' || currentFilter === 'skill') ? 'flex' : 'none';

            const traitSubfiltersContainer = document.getElementById('trait-subfilters');
            traitSubfiltersContainer.style.display = (currentFilter === 'all' || currentFilter === 'trait') ? 'flex' : 'none';

            const spellSubfiltersContainer = document.getElementById('spell-subfilters');
            spellSubfiltersContainer.style.display = (currentFilter === 'all' || currentFilter === 'spell') ? 'flex' : 'none';

            document.getElementById('stats').textContent = `${visibleCount} image${visibleCount > 1 ? 's' : ''} affichée${visibleCount > 1 ? 's' : ''}`;
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            applyFilters();
        });

        // Lightbox
        function openLightbox(category, filename, subCategory = null) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const title = document.getElementById('lightbox-title');
            const cat = document.getElementById('lightbox-category');

            const imgPath = subCategory
                ? `pictures_webp/${category}/${subCategory}/${filename}.webp`
                : `pictures_webp/${category}/${filename}.webp`;
            img.src = imgPath;
            title.textContent = formatName(filename);
            cat.textContent = subCategory
                ? `${category} / ${subCategory}`
                : category.replace('-', ' ');
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Toggle mobile filters
        document.getElementById('menu-toggle').addEventListener('click', function() {
            const controls = document.querySelector('.controls');
            controls.classList.toggle('open');
            this.classList.toggle('open');
            this.textContent = controls.classList.contains('open') ? '✕' : '☰';
        });

        // Initialize
        initGallery();
    </script>
