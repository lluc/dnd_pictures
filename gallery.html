<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        header {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #c9a227;
        }

        h1 {
            text-align: center;
            color: #c9a227;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #c9a227;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.3);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #c9a227;
            border-radius: 20px;
            background: transparent;
            color: #c9a227;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: capitalize;
        }

        .filter-btn:hover {
            background: rgba(201, 162, 39, 0.2);
        }

        .filter-btn.active {
            background: #c9a227;
            color: #1a1a2e;
        }

        .stats {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 0.9rem;
        }

        main {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            color: #c9a227;
            font-size: 1.8rem;
            padding: 15px 0;
            border-bottom: 2px solid rgba(201, 162, 39, 0.3);
            margin-bottom: 20px;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title .count {
            font-size: 1rem;
            color: #888;
            font-weight: normal;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(201, 162, 39, 0.2);
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(201, 162, 39, 0.2);
            border-color: #c9a227;
        }

        .image-card.hidden {
            display: none;
        }

        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .image-card .name {
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            color: #c9a227;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lightbox-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(201, 162, 39, 0.3);
        }

        .lightbox-title {
            color: #c9a227;
            font-size: 1.5rem;
            margin-top: 20px;
            text-align: center;
        }

        .lightbox-category {
            color: #888;
            font-size: 1rem;
            margin-top: 5px;
            text-transform: capitalize;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .image-card img {
                height: 140px;
            }

            .filter-btn {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }

        /* Loading animation */
        .image-card img {
            opacity: 0;
            transition: opacity 0.3s;
        }

        .image-card img.loaded {
            opacity: 1;
        }
    </style>
</head>

        // Format name for display
        function formatName(filename) {
            return filename
                .replace(/_/g, ' ')
                .replace(/,/g, ', ')
                .replace(/\(/g, ' (')
                .replace(/\s+/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ')
                .trim();
        }

        // Create image card
        function createImageCard(category, filename) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.dataset.category = category;
            card.dataset.name = filename.toLowerCase();

            const img = document.createElement('img');
            img.src = `pictures_webp/${category}/${filename}.webp`;
            img.alt = formatName(filename);
            img.loading = 'lazy';
            img.onload = () => img.classList.add('loaded');

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = formatName(filename);
            name.title = formatName(filename);

            card.appendChild(img);
            card.appendChild(name);

            card.addEventListener('click', () => openLightbox(category, filename));

            return card;
        }

        // Initialize gallery
        function initGallery() {
            for (const [category, images] of Object.entries(imageData)) {
                const gallery = document.getElementById(`gallery-${category}`);
                images.forEach(filename => {
                    gallery.appendChild(createImageCard(category, filename));
                });
            }
        }

        // Filter functions
        let currentFilter = 'all';
        let currentSearch = '';

        function applyFilters() {
            const cards = document.querySelectorAll('.image-card');
            const sections = document.querySelectorAll('.category-section');
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesFilter = currentFilter === 'all' || card.dataset.category === currentFilter;
                const matchesSearch = currentSearch === '' || card.dataset.name.includes(currentSearch.toLowerCase());
                const isVisible = matchesFilter && matchesSearch;

                card.classList.toggle('hidden', !isVisible);
                if (isVisible) visibleCount++;
            });

            // Show/hide sections
            sections.forEach(section => {
                const category = section.dataset.category;
                const hasVisibleCards = section.querySelectorAll('.image-card:not(.hidden)').length > 0;
                const matchesFilter = currentFilter === 'all' || category === currentFilter;
                section.style.display = (matchesFilter && hasVisibleCards) ? 'block' : 'none';
            });

            document.getElementById('stats').textContent = `${visibleCount} image${visibleCount > 1 ? 's' : ''} affichée${visibleCount > 1 ? 's' : ''}`;
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            applyFilters();
        });

        // Lightbox
        function openLightbox(category, filename) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const title = document.getElementById('lightbox-title');
            const cat = document.getElementById('lightbox-category');

            img.src = `pictures_webp/${category}/${filename}.webp`;
            title.textContent = formatName(filename);
            cat.textContent = category.replace('-', ' ');
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Initialize
        initGallery();
    </script>
